version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:30"
      timezone: "Europe/Berlin"
    allow:
      # Dependencies maintained by the Vike team
      - dependency-name: "@batijs/*"
      - dependency-name: "@brillout/*"
      - dependency-name: "@photonjs/*"
      - dependency-name: "@universal-middleware/*"
      - dependency-name: "@universal-deploy/*"
      - dependency-name: "@vikejs/*"
      - dependency-name: "react-streaming"
      - dependency-name: "telefunc"
      - dependency-name: "vike-*"
      - dependency-name: "vite-plugin-vercel"
      - dependency-name: "vite-plugin-wrapper"
      # devDependencies
      - dependency-name: "vitest"
      - dependency-name: "typescript"
      - dependency-name: "rimraf"
      # dependencies
      - dependency-name: "json5"
      - dependency-name: "magic-string"
      - dependency-name: "picomatch"
      - dependency-name: "semver"
      - dependency-name: "sirv"
      - dependency-name: "source-map-support"
      - dependency-name: "tinyglobby"
    # Make Dependabot bump vike-react and react-streaming in a single PR
    # - Because vike-react depends on react-streaming: bumping them in separate PRs leads to the warning that two different react-streaming versions are loaded
    groups:
      react-streaming:
        patterns: ["react-streaming", "vike-react"]
    # Skip Dependabot's 3-day release delay for packages we maintain
    cooldown:
      # Same list as "Dependencies maintained by the Vike team" above
      exclude:
        - "@batijs/*"
        - "@brillout/*"
        - "@photonjs/*"
        - "@universal-middleware/*"
        - "@universal-deploy/*"
        - "@vikejs/*"
        - "react-streaming"
        - "telefunc"
        - "vike-*"
        - "vite-plugin-vercel"
        - "vite-plugin-wrapper"
