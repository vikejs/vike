version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:30"
      timezone: "Europe/Berlin"
    allow:
      # Dependencies maintained by the Vike team
      - dependency-name: "@batijs/*"
      - dependency-name: "@brillout/*"
      - dependency-name: "@photonjs/*"
      - dependency-name: "@universal-middleware/*"
      - dependency-name: "@universal-deploy/*"
      - dependency-name: "@vikejs/*"
      - dependency-name: "react-streaming"
      - dependency-name: "telefunc"
      - dependency-name: "vike-*"
      - dependency-name: "vite-plugin-vercel"
      - dependency-name: "vite-plugin-wrapper"
      # devDependencies
      - dependency-name: "vitest"
      - dependency-name: "typescript"
      - dependency-name: "rimraf"
      # dependencies
      - dependency-name: "json5"
      - dependency-name: "magic-string"
      - dependency-name: "picomatch"
      - dependency-name: "semver"
      - dependency-name: "sirv"
      - dependency-name: "source-map-support"
      - dependency-name: "tinyglobby"
    groups:
      # vike-react depends on react-streaming: bumping them in separate PRs loads two react-streaming versions
      react-streaming:
        patterns: ["react-streaming", "vike-react"]
    cooldown:
      # Same list as "Dependencies maintained by the Vike team" above: they skip Dependabot's default 3-day cooldown.
      # - Otherwise Dependabot holds back a react-streaming release for 3 days, while vike-react's own react-streaming dependency resolves to it
      exclude:
        - "@batijs/*"
        - "@brillout/*"
        - "@photonjs/*"
        - "@universal-middleware/*"
        - "@universal-deploy/*"
        - "@vikejs/*"
        - "react-streaming"
        - "telefunc"
        - "vike-*"
        - "vite-plugin-vercel"
        - "vite-plugin-wrapper"
