name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (use beta for prereleases)'
        type: string
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'vikejs/vike'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm run build
      - name: Publish vike
        working-directory: packages/vike
        run: npm publish --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag }}
