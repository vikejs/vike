# Keeps GitHub Releases in sync with CHANGELOG.md, see https://github.com/brillout/release-me#github-release
# - By pushing a CHANGELOG.md change to main (e.g. a release commit), or
# - by pressing the "Run workflow" button (it then syncs all packages).

# DON'T MODIFY THIS FILE: it's a copy of https://github.com/brillout/release-me/blob/main/.github/workflows/release-github.yml created and updated by `$ pnpm exec release-me init`.

name: GitHub Release

on:
  push:
    branches:
      - main
    paths:
      # Any CHANGELOG.md — at the repo root or nested (e.g. packages/some-package/CHANGELOG.md).
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs: two quick CHANGELOG.md pushes would otherwise race to create the same release
# (the loser fails with 422 already_exists). Don't cancel an in-progress run — let a backfill finish.
concurrency:
  group: sync-github-releases
  cancel-in-progress: false
  # Keep every pending run: by default, a new pending run cancels the older one, whose packages (a push only syncs the packages whose CHANGELOG.md it changes) would then not be synced
  queue: max

jobs:
  sync_github_releases:
    # The default branch's CHANGELOG.md is the source of truth: syncing another branch's (selected in "Use workflow from") would delete the releases it doesn't have
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/checkout@v7
        with:
          # All commits and tags: release dates and the commits of missing tags are read from the Git history
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # Syncing GitHub Releases doesn't need the dependencies' install scripts, which can stall the run (e.g. a
      # `playwright-chromium` stuck downloading its browser)
      - run: pnpm install --ignore-scripts
      - name: Create GitHub releases
        run: pnpm exec release-me github-release-sync
        env:
          # GITHUB_EVENT_NAME, GITHUB_SHA, GITHUB_EVENT_PATH and GITHUB_REPOSITORY are provided automatically
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
